<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img" aria-labelledby="title"><title id="title">周期測定終了画面</title><rect width="320" height="240" fill="#0b1420"/><g font-family="Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif" font-size="14" fill="#edf4ff"><rect width="320" height="24" fill="#1b293b"/><text x="12" y="18" fill="#68b8ff">周期測定終了</text><text x="12" y="52">取得 50/50　成功 50</text><text x="12" y="80" fill="#a8b6c9">取得間隔（例、単位 ms）</text><g font-family="Consolas,monospace" font-size="18"><text x="12" y="110">MIN</text><text x="298" y="110" text-anchor="end">18.91</text><text x="12" y="139">MEAN</text><text x="298" y="139" text-anchor="end">19.02</text><text x="12" y="168">MAX</text><text x="298" y="168" text-anchor="end">19.24</text></g><text x="12" y="197" font-size="12" fill="#a8b6c9">50回分のCSVはシリアルへ出力</text><rect y="216" width="320" height="24" fill="#273e59"/><text x="8" y="233" font-size="12">A 再測定</text><text x="118" y="233" font-size="11">リセットで自動再測定</text></g></svg>