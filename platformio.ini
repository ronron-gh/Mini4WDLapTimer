; PlatformIO Project Configuration File
[platformio]
default_envs = m5stack-core-esp32

[env]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
lib_deps =
    m5stack/M5Unified@^0.2.25
    pololu/VL53L0X@^1.3.1
monitor_speed = 115200

[env:m5stack-core-esp32]
build_flags = -DLAP_TIMER_BENCHMARK_MODE=0
build_src_filter = +<*> -<BenchmarkTasks.cpp> -<Benchmark.cpp> -<BenchmarkData.cpp> -<BenchmarkSession.cpp>

[env:m5stack-core-esp32-benchmark]
build_flags = -DLAP_TIMER_BENCHMARK_MODE=1
build_src_filter = +<*> -<LapTimerTasks.cpp> -<LapTimer.cpp>
